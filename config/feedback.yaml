learned_rules:
  - "2026-11-06: 第一版规则。优先保留有具体人物、硬数字、对抗性张力的条目。"
  - 不要把“模型发布”同时塞进 company_event_keywords；公司事件只收公司级动作。
  - 同一事件在不同信源重复出现时，合并为一条信息量最大的关键词，不要按来源重复计数。
